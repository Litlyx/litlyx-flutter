name: litlyx_flutter
description: >-
  Cookie-free, privacy-friendly analytics for Flutter apps with Litlyx:
  screen views, custom events, sessions and an offline queue, in pure Dart.
version: 0.1.0
homepage: https://litlyx.com
repository: https://github.com/litlyx/litlyx-flutter
issue_tracker: https://github.com/litlyx/litlyx-flutter/issues
topics:
  - analytics
  - tracking
  - privacy
  - gdpr
  - events

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.3.0

dev_dependencies:
  fake_async: ^1.3.1
  flutter_lints: ">=5.0.0 <7.0.0"
  flutter_test:
    sdk: flutter
